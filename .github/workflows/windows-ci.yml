name: Windows CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore SynthiaCode.sln

      - name: Test
        run: dotnet test SynthiaCode.sln --configuration Release --no-restore --settings SynthiaCode.runsettings --logger "console;verbosity=normal"

  package:
    name: Package portable app
    needs: test
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: windows-latest
    outputs:
      artifact-name: ${{ steps.release-metadata.outputs.artifact-name }}
      version: ${{ steps.release-metadata.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Read and validate release metadata
        id: release-metadata
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath "src\SynthiaCode.App\SynthiaCode.App.csproj" -Raw
          $version = [string]$project.Project.PropertyGroup.Version

          if ([string]::IsNullOrWhiteSpace($version)) {
              throw "The app project does not define a Version."
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
              throw "The app version '$version' is not a supported semantic version."
          }

          if ($env:GITHUB_REF -like "refs/tags/v*") {
              $tagVersion = $env:GITHUB_REF_NAME.Substring(1)
              if ($tagVersion -cne $version) {
                  throw "Release tag '$env:GITHUB_REF_NAME' does not match app version '$version'."
              }
          }

          $artifactName = "SynthiaCode-$version-win-x64-build-$env:GITHUB_RUN_NUMBER"
          "artifact-name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish self-contained portable app
        shell: pwsh
        run: .\scripts\publish-portable.cmd -Configuration Release -Runtime win-x64

      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release-metadata.outputs.artifact-name }}
          path: portable/SynthiaCode/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    needs: package
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download packaged app
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: portable/SynthiaCode

      - name: Create release archive and checksum
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $releaseRoot = Join-Path $PWD "release"
          $archiveName = "SynthiaCode-$env:RELEASE_VERSION-win-x64.zip"
          $archivePath = Join-Path $releaseRoot $archiveName
          $checksumPath = "$archivePath.sha256"

          if (-not (Test-Path -LiteralPath "portable\SynthiaCode\SynthiaCode.App.exe")) {
              throw "The downloaded artifact does not contain SynthiaCode.App.exe."
          }

          New-Item -ItemType Directory -Path $releaseRoot -Force | Out-Null
          Compress-Archive -Path "portable\SynthiaCode" -DestinationPath $archivePath -CompressionLevel Optimal

          $hash = (Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Out-File -LiteralPath $checksumPath -Encoding ascii

      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $tag = $env:GITHUB_REF_NAME
          $archive = "release\SynthiaCode-$env:RELEASE_VERSION-win-x64.zip"
          $checksum = "$archive.sha256"

          $null = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $archive $checksum --clobber
              if ($LASTEXITCODE -ne 0) {
                  throw "Failed to update release assets for '$tag'."
              }
              exit 0
          }

          $arguments = @(
              "release", "create", $tag,
              $archive, $checksum,
              "--verify-tag",
              "--generate-notes",
              "--title", "SynthiaCode $env:RELEASE_VERSION"
          )

          if ($env:RELEASE_VERSION.Contains("-")) {
              $arguments += "--prerelease"
          }

          gh @arguments
          if ($LASTEXITCODE -ne 0) {
              throw "Failed to publish GitHub release '$tag'."
          }
